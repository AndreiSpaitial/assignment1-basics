experiment_name: initial
train_path: data/tokenized/tinystories_train.npy
eval_path: data/tokenized/tinystories_valid.npy
checkpoint_dir: cs336_basics/scripts/train/checkpoints/
checkpoint_every: 500
epochs: 1
eval_every: 750
shuffle: True
batch_size: 256
max_steps: 5000

gradient_clipping:
  M: 1

lr_conf:
  lr_max: 1.0
  lr_min: 1.0e-2
  t_W: 10
  t_C: 100

rope:
  theta: 10000

transformer:
  d_model: 512
  num_heads: 16
  context_length: 256
  num_layers: 4
  d_ff: 1334

tokenizer:
  checkpoint_dir: cs336_basics/tokenizer/checkpoints/tinystories/
  special_tokens: ["<|endoftext|>"]

optimizer:
  lr: 1.0e-1
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]
